<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace Officiers · Brunssum</title>
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#F3F5F7,#0E141B);
  --paper:light-dark(#FFFFFF,#151D26);
  --ink:light-dark(#15202B,#E3E8EE);
  --muted:light-dark(#5B6877,#93A0AE);
  --line:light-dark(#D8DEE4,#283340);
  --navy:light-dark(#1A335C,#8FB3E6);
  --navy-soft:light-dark(#E6EDF7,#1B2838);
  --err:light-dark(#A12A2A,#F08C8C);
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f)}
header{background:var(--navy);color:light-dark(#fff,#0E141B);padding:18px 20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:1.25rem;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
.wrap{max-width:1000px;margin:0 auto}
main{padding:24px 16px 48px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px}
#gate{max-width:380px;margin:40px auto;text-align:center}
#gate h2{margin:0 0 6px;font-size:1.15rem}
#gate p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
#code{width:100%;font:600 1.8rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;text-align:center;padding:14px 0 14px .15em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#code:focus{outline:2px solid var(--navy);outline-offset:1px}
button{font:600 1rem var(--f);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--navy);color:light-dark(#fff,#0E141B)}
button:disabled{opacity:.6;cursor:wait}
#submit{width:100%;margin-top:12px}
#error{min-height:1.4em;margin-top:10px;color:var(--err);font-size:.9rem}
#lock{background:transparent;border:1px solid currentColor;color:inherit;padding:6px 12px;font-size:.85rem}
#app section{margin-bottom:28px}
#app h2{font-size:1.1rem;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px}
#app .note{background:var(--navy-soft);border-radius:6px;padding:10px 12px;font-size:.92rem}
#app .date{display:inline-block;min-width:88px;font-weight:600;color:var(--navy)}
#app ul{padding-left:20px}
#app ul.agenda{list-style:none;padding:0}
#app ul.agenda li{padding:6px 0;border-bottom:1px dashed var(--line)}
#app h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
#app ul.fetes{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
#app ul.fetes li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
#app .tile{flex:none;width:52px;text-align:center;background:var(--navy);color:light-dark(#fff,#0E141B);border-radius:6px;padding:6px 0;line-height:1.1}
#app .tile b{display:block;font-size:1.3rem}
#app .tile small{font-size:.65rem;font-weight:600;letter-spacing:.05em}
#app .txt strong{display:block;font-size:.95rem}
#app .txt span{display:block;font-size:.85rem;color:var(--muted);line-height:1.4}
#app li.next{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;background:var(--navy-soft)}
#app li.next .txt strong::after{content:"Prochaine";margin-left:8px;font-size:.7rem;font-weight:600;color:var(--navy);border:1px solid var(--navy);border-radius:10px;padding:1px 7px;vertical-align:2px}
#app li.past{opacity:.55}
#app .next-line{background:var(--navy-soft);border-radius:6px;padding:10px 12px;font-size:.95rem}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
#tabs button{background:var(--paper);color:var(--navy);border:1px solid var(--line);padding:9px 16px;font-size:.95rem}
#tabs button[aria-selected="true"]{background:var(--navy);color:light-dark(#fff,#0E141B);border-color:var(--navy)}
#app ul.spots{list-style:none;padding:0;margin:0;display:grid;gap:8px}
#app ul.spots li{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#app ul.spots strong{display:block;font-size:.98rem}
#app ul.spots .meta{display:block;font-size:.8rem;font-weight:600;color:var(--navy);margin:2px 0 4px}
#app ul.spots li > span:last-child{display:block;font-size:.9rem;color:var(--muted);line-height:1.45}
#app .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#app .chips button{background:var(--navy-soft);color:var(--navy);padding:7px 12px;font-size:.88rem;border-radius:16px}
#app details.fiche{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;scroll-margin-top:12px}
#app details.fiche summary{cursor:pointer;list-style:none;padding:12px 40px 12px 12px;position:relative}
#app details.fiche summary::-webkit-details-marker{display:none}
#app details.fiche summary::after{content:"+";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1.3rem;color:var(--navy)}
#app details.fiche[open] summary::after{content:"–"}
#app details.fiche[open] summary{border-bottom:1px solid var(--line)}
#app details.fiche summary strong{display:block}
#app details.fiche summary span{display:block;font-size:.85rem;color:var(--muted)}
#app details.fiche .body{padding:4px 14px 10px;font-size:.95rem}
#app details.fiche li{margin-bottom:6px}
#app .warn{border-left:3px solid var(--err);background:light-dark(#FBEFEF,#2A1A1A);padding:8px 10px;border-radius:0 6px 6px 0;font-size:.9rem}
#app a{color:var(--navy);word-break:break-word}
#app .shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
#app a.shortcut{display:block;text-decoration:none;border:1px solid var(--navy);border-radius:8px;padding:12px 14px;color:var(--ink)}
#app a.shortcut strong{display:block;color:var(--navy)}
#app a.shortcut strong::after{content:" ↗"}
#app a.shortcut span{display:block;font-size:.85rem;color:var(--muted)}
#app a.shortcut:hover{background:var(--navy-soft)}
#app .src{font-size:.8rem;color:var(--muted);margin:-4px 0 8px;font-style:italic}
#app .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#app .cal-head h4{margin:0;flex:1;text-align:center;font-size:1.05rem;text-transform:capitalize}
#app .cal-head button{background:var(--navy-soft);color:var(--navy);padding:6px 12px}
#app .cal-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);margin:0 0 8px}
#app .cal-legend i,#app .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
#app .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
#app .cal-grid .dow{font-size:.72rem;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
#app .cal-grid button.day{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;min-height:96px;padding:4px;font-weight:500;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;text-align:left;overflow:hidden}
#app .cal-grid .num{font-size:.85rem;padding:0 2px}
#app .cal-grid .chip{display:block;font-size:.7rem;font-weight:600;line-height:1.25;color:#fff;border-radius:3px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app .cal-grid .more{font-size:.7rem;color:var(--muted);padding:0 3px}
#app .cal-grid button.day.sel .more{color:inherit}
#app .cal-grid button.day.sel .chip{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
@media (max-width:640px){
  #app.card{padding:14px}
  #app .cal-grid{gap:2px}
  #app .cal-grid button.day{min-height:64px;padding:2px}
  #app .cal-grid .num{font-size:.75rem}
  #app .cal-grid .chip{font-size:.58rem;padding:1px 2px;border-radius:2px}
  #app .cal-grid .more{font-size:.6rem}
}
#app .cal-grid button.day.out{visibility:hidden}
#app .cal-grid button.day.today{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
#app .cal-grid button.day.sel{background:var(--navy-soft);border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
#app .cal-grid .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
#app .cal-grid .dots .dot{margin:0;width:6px;height:6px}
#app .c-fete{background:#1A335C}#app .c-admin{background:#0E7490}#app .c-commu{background:#C2185B}#app .c-noel{background:#B3261E}#app .c-musique{background:#7A4FB0}#app .c-sortie{background:#1F7A4A}#app .c-carnaval{background:#D98A00}
#app .cal-list h5{margin:16px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#app .cal-list ul{list-style:none;padding:0;margin:0}
#app .cal-list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
#app .cal-list .when{flex:none;width:92px;font-size:.82rem;font-weight:600;color:var(--navy)}
#app .cal-list .what strong{display:block;font-size:.95rem}
#app .cal-list .what span{display:block;font-size:.84rem;color:var(--muted)}
#app .past-ev{margin-top:12px;font-size:.92rem}
#app .past-ev summary{cursor:pointer;color:var(--muted);font-weight:600}
#app .past-ev ul{opacity:.7}
#app .cal-list .empty{color:var(--muted);font-size:.9rem}
#app .map{height:420px;border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden;background:var(--bg);position:relative;z-index:0}
#app .map-msg{padding:16px;color:var(--muted);font-size:.9rem}
#app .map-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#app .map-filters button{padding:6px 12px;font-size:.85rem;border-radius:16px;background:var(--navy-soft);color:var(--navy)}
#app .map-filters button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#app ul.spots li[data-lat]{cursor:pointer}
#app ul.spots li.hl{outline:2px solid var(--navy)}
#app .leaflet-popup-content{font:13px/1.4 var(--f)}
#app svg.ico,#tabs svg.ico{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;margin-right:.4em;flex:none}
#app h2 svg.badge{width:1.7em;height:1.7em;padding:.32em;border-radius:8px;background:var(--navy);stroke:light-dark(#fff,#0E141B);vertical-align:-.45em;margin-right:.5em}
#app h3 svg.ico{width:1.25em;height:1.25em;vertical-align:-.3em;color:var(--navy)}
#app details.fiche summary.with-ico{padding-left:62px;min-height:58px}
#app svg.tile-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:7px;border-radius:8px;background:var(--navy-soft);color:var(--navy);margin:0}
#app .chips svg.ico{margin-right:.3em}
#app section.news{background:light-dark(#FFF8E6,#2A2414);border:1px solid light-dark(#F0D9A0,#4A3E22);border-radius:10px;padding:14px 16px 6px}
#app section.news h2{border-bottom-color:light-dark(#F0D9A0,#4A3E22)}
#app .news-date{margin:-4px 0 8px;font-size:.8rem;color:var(--muted)}
#app section.news li{margin-bottom:8px}
#app button.dl{display:inline-flex;align-items:center;gap:6px;margin:6px 0 4px;font-size:.92rem}
#app .dl-note{display:block;font-size:.85rem;color:var(--muted);margin:2px 0 8px}
#app .dl-note a{color:var(--navy);font-weight:600}
#app button.lnk{background:none;border:0;padding:0;font:inherit;font-size:.9rem;font-weight:600;color:var(--navy);text-decoration:underline;cursor:pointer}
#app button.lnk::after{content:" →"}
#app .draw-bar{display:flex;gap:8px;flex-wrap:wrap}
#app .draw-out{margin-top:10px;border:1px dashed var(--navy);border-radius:8px;padding:10px 14px;background:var(--navy-soft)}
#app .draw-out li{margin:4px 0;font-weight:600}
#app .cc-filters{display:grid;gap:8px}
#app #cc-q{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#app .chips button[aria-pressed="true"]{background:var(--navy);color:light-dark(#fff,#0E141B)}
#app .chips button[aria-pressed="false"]{opacity:1}
#app .cc-count{font-size:.85rem;color:var(--muted);margin:10px 0 6px}
#app details.cc summary{padding-left:12px}
#app details.cc h6{margin:10px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}
#app .pre{white-space:pre-line;margin:0;font-size:.92rem}
#app mark{background:#FFE58A;color:inherit;border-radius:2px}
#app button.dl.alt{background:var(--navy-soft);color:var(--navy)}
#app .quiz-start{display:grid;gap:8px;max-width:420px}
#app .ini-l{font-weight:600;font-size:.9rem}
#app #quiz-ini{font:700 1.4rem/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:10ch}
#app #quiz-ini.shake{animation:shk .4s;border-color:var(--err)}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#app .quiz-play{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:6px}
#app .qz-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:600}
#app .qz-pts{color:var(--navy)}
#app .qz-bar,#app .qz-timer{height:6px;background:var(--navy-soft);border-radius:3px;margin-top:8px;overflow:hidden}
#app .qz-bar i{display:block;height:100%;background:var(--navy)}
#app .qz-timer i{display:block;height:100%;width:100%;background:#1F7A4A;transition:width .1s linear}
#app .qz-timer i.low{background:#B3261E}
#app .qz-q{font-size:1.15rem;font-weight:600;margin:16px 0 12px}
#app .qz-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
#app .qz-o{background:var(--paper);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:500;padding:12px 14px}
#app .qz-o:not([disabled]):hover{border-color:var(--navy)}
#app .qz-o.ok{border-color:#1F7A4A;background:light-dark(#E5F3EA,#16291D)}
#app .qz-o.ko{border-color:#B3261E;background:light-dark(#F8E6E6,#2E1818)}
#app .qz-fb{margin-top:12px}
#app .qz-fb b.g{color:#1F7A4A}#app .qz-fb b.b{color:#B3261E}
#app .qz-end{text-align:center;padding:10px 0}
#app .qz-title{font-size:1.3rem;font-weight:700;margin:0}
#app .qz-big{font-size:2.4rem;font-weight:800;color:var(--navy);margin:6px 0}
#app ol.lb{list-style:none;padding:0;margin:0 0 12px}
#app ol.lb li{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
#app ol.lb .pts{font-weight:700;color:var(--navy)}
#app #quiz-board h6{margin:6px 0;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#app ul.cits{list-style:none;padding:0;margin:0 0 6px}
#app ul.cits li{padding:6px 0 6px 12px;border-left:3px solid var(--navy-soft);margin-bottom:6px;font-style:italic}
#app ul.cits .who{display:block;font-style:normal;font-size:.85rem;font-weight:600;color:var(--navy)}
#app ul.cits .chk{display:block;font-style:normal;font-size:.8rem;color:var(--err)}
#app details.fiche .body h6{margin:12px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}
#app details.pf-wrap{margin:8px 0}
#app details.pf-wrap > summary{display:inline-block;list-style:none;cursor:pointer;margin-bottom:8px}
#app details.pf-wrap > summary::-webkit-details-marker{display:none}
#app .pf{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--paper)}
#app .pf-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem}
#app .pf h4{text-align:center;margin:12px 0 0;font-size:1.15rem;letter-spacing:.03em}
#app .pf-sub{text-align:center;margin:0 0 12px;font-size:.8rem}
#app .pf-grid{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:8px 12px;align-items:center}
#app .pf-grid label{font-size:.85rem;font-weight:600}
#app .pf input,#app .pf textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:light-dark(#EEF6E9,#1A2A1F);color:var(--ink)}
#app .pf input[type=checkbox]{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
#app .pf .wide{width:100%}
#app .pf-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#app .pf-sec{font-weight:700;font-size:.85rem;margin:16px 0 8px;border-top:1px solid var(--line);padding-top:10px}
#app .pf-red,#app .pf-red-t{color:#C0262D;font-size:.8rem;font-weight:600}
#app .pf-red-t{text-align:center}
#app .pf-sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;font-size:.82rem;margin-top:8px}
#app .pf-box{height:70px;border:1px solid var(--line);border-radius:4px;margin-top:6px;background:light-dark(#EEF6E9,#1A2A1F)}
#app .pf-chk{margin-top:6px;font-weight:600}
#app .pf-foot{font-size:.72rem;margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
@media print{
  body.print-pf > *:not(#print-area){display:none !important}
  #print-area{display:block}
  #print-area .pf{border:0;padding:0;background:#fff;color:#000}
  #print-area .no-print{display:none}
  #print-area input,#print-area textarea,#print-area .pf-box{background:#fff !important;border-color:#888 !important;color:#000 !important}
  body.print-pf{background:#fff !important;margin:0}
  #print-area{font-size:12px;line-height:1.35}
  #print-area .pf-box{height:52px !important}
  #print-area .pf-grid{gap:5px 10px !important}
  #print-area .pf-sec{margin:10px 0 6px !important;padding-top:6px !important}
  #print-area .pf input,#print-area .pf textarea{padding:4px 6px !important}
  #print-area .pf h4{margin-top:6px !important}
  @page{size:A4;margin:10mm}
}
@media screen{#print-area{display:none}}
#print-area .pf{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--paper)}
#print-area .pf-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem}
#print-area .pf h4{text-align:center;margin:12px 0 0;font-size:1.15rem;letter-spacing:.03em}
#print-area .pf-sub{text-align:center;margin:0 0 12px;font-size:.8rem}
#print-area .pf-grid{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:8px 12px;align-items:center}
#print-area .pf-grid label{font-size:.85rem;font-weight:600}
#print-area .pf input,#print-area .pf textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:light-dark(#EEF6E9,#1A2A1F);color:var(--ink)}
#print-area .pf input[type=checkbox]{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
#print-area .pf .wide{width:100%}
#print-area .pf-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#print-area .pf-sec{font-weight:700;font-size:.85rem;margin:16px 0 8px;border-top:1px solid var(--line);padding-top:10px}
#print-area .pf-red,#print-area .pf-red-t{color:#C0262D;font-size:.8rem;font-weight:600}
#print-area .pf-red-t{text-align:center}
#print-area .pf-sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;font-size:.82rem;margin-top:8px}
#print-area .pf-box{height:70px;border:1px solid var(--line);border-radius:4px;margin-top:6px;background:light-dark(#EEF6E9,#1A2A1F)}
#print-area .pf-chk{margin-top:6px;font-weight:600}
#print-area .pf-foot{font-size:.72rem;margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>Espace Officiers</h1><p>Communauté des officiers · Brunssum</p></div>
  <button id="lock" hidden type="button">Verrouiller</button>
</div></header>
<main class="wrap">
  <form id="gate" class="card" autocomplete="off">
    <h2>Accès réservé</h2>

const $ = id => document.getElementById(id);
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const gate = $("gate"), input = $("code"), err = $("error"), app = $("app"), tabs = $("tabs"), lock = $("lock"), btn = $("submit");

input.addEventListener("input", () => { input.value = input.value.toUpperCase(); err.textContent = ""; });

let KEY = null;
async function open(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.i)}, key, b(P.c));
  KEY = key;
  return new TextDecoder().decode(pt);
}

gate.addEventListener("submit", async e => {
  e.preventDefault();
  const code = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 8) { err.textContent = "Le code comporte 8 caractères."; return; }
  btn.disabled = true; btn.textContent = "Vérification…"; err.textContent = "";
  try {
    app.innerHTML = await open(code);
    gate.hidden = true; app.hidden = false; lock.hidden = false;
    markNext();
    buildTabs();
    buildCalendar();
    decorate();
  } catch (_) {
    err.textContent = "Code incorrect.";
    input.select();
  } finally {
    btn.disabled = false; btn.textContent = "Entrer";
  }
});

function markNext() {
  const items = [...app.querySelectorAll("li[data-md]")];
  if (!items.length) return;
  const now = new Date();
  const today = String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  let firstMd = items.find(li => li.dataset.md >= today)?.dataset.md || items[0].dataset.md;
  items.forEach(li => {
    if (li.dataset.md === firstMd) li.classList.add("next");
    else if (li.dataset.md < today) li.classList.add("past");
  });
  const nexts = items.filter(li => li.dataset.md === firstMd);
  const line = app.querySelector("#next-fete");
  if (line) {
    const [m, d] = firstMd.split("-").map(Number);
    const date = new Date(now.getFullYear() + (firstMd < today ? 1 : 0), m - 1, d);
    const label = date.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
    const names = nexts.map(li => li.querySelector("strong").textContent).join(", ");
    line.textContent = (firstMd === today ? "Aujourd'hui : " : "Prochaine fête d'armes : ") + names + " (" + label + ")";
    line.hidden = false;
  }
}

function buildTabs() {
  const pages = [...app.querySelectorAll(".page")];
  tabs.innerHTML = "";
  if (pages.length < 2) return;
  const show = id => {
    pages.forEach(p => p.hidden = p.dataset.page !== id);
    [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.page === id));
    try { history.replaceState(null, "", "#" + id); } catch (_) {}
    if (id === "bons-plans") initMap();
    if (id === "concours") initConcours();
    if (id === "quiz") initQuiz();
    if (id !== "quiz") clearInterval(qzTimer);
    window.scrollTo(0, 0);
  };
  pages.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab");
    b.dataset.page = p.dataset.page; b.textContent = p.dataset.title;
    b.addEventListener("click", () => show(p.dataset.page));
    tabs.appendChild(b);
  });
  const start = location.hash.slice(1);
  show(pages.some(p => p.dataset.page === start) ? start : pages[0].dataset.page);
  tabs.hidden = false;
}

async function decryptFile(name) {
  const f = (P.f || {})[name];
  if (!f || !KEY) throw new Error("missing");
  const r = await fetch(f.p, {cache: "no-cache"});
  if (!r.ok) throw new Error("fetch " + r.status);
  return crypto.subtle.decrypt({name: "AES-GCM", iv: b(f.i)}, KEY, await r.arrayBuffer());
}
async function getFile(name, dl, btn) {
  const note = (msg, html) => {
    if (!btn) return;
    let n = btn.nextElementSibling;
    if (!n || !n.classList.contains("dl-note")) { n = document.createElement("span"); n.className = "dl-note"; btn.after(n); }
    n.innerHTML = html || esc(msg);
  };
  note("Préparation du document…");
  let buf;
  try { buf = await decryptFile(name); }
  catch (_) { note("Document indisponible pour le moment (publication en cours ou connexion filtrée). Réessayez dans quelques minutes ou depuis un autre appareil."); return; }
  const ext = name.split(".").pop(), MIME = {pdf: "application/pdf", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation"};
  const url = URL.createObjectURL(new Blob([buf], {type: MIME[ext] || "application/octet-stream"}));
  try {
    const a = document.createElement("a");
    a.href = url; a.download = dl || name; document.body.appendChild(a); a.click(); a.remove();
  } catch (_) {}
  note("", `Téléchargement lancé. Rien ne s'est passé ? <a href="${url}" target="_blank" rel="noopener">Ouvrir le document</a>${ext === "pdf" ? "" : " ou essayez depuis un téléphone ou un ordinateur personnel"}.`);
  setTimeout(() => URL.revokeObjectURL(url), 10 * 60000);
}
const goTab = id => { const b = tabs.querySelector(`button[data-page="${id}"]`); if (b) b.click(); };
app.addEventListener("click", e => {
  if (e.target.closest("[data-print-form]")) {
    const f = app.querySelector("#pf");
    f.querySelectorAll("input,textarea").forEach(el => {
      if (el.type === "checkbox") el.checked ? el.setAttribute("checked", "") : el.removeAttribute("checked");
      else if (el.tagName === "TEXTAREA") el.textContent = el.value; else el.setAttribute("value", el.value);
    });
    const area = document.createElement("div"); area.id = "print-area"; area.className = "pf-print";
    area.appendChild(f.cloneNode(true)); document.body.appendChild(area); document.body.classList.add("print-pf");
    const done = () => { document.body.classList.remove("print-pf"); area.remove(); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done); window.print(); setTimeout(done, 2000); return;
  }
  const ml = e.target.closest("[data-mail-link]");
  if (ml) {
    const url = location.origin + location.pathname + "#" + (ml.dataset.mailLink || "");
    const body = `Lien vers l'Espace Officiers, à ouvrir sur un appareil personnel pour télécharger le document « ${ml.dataset.doc || ""} » :\n${url}\n\n(Le code d'accès n'est volontairement pas inclus.)`;
    location.href = "mailto:?subject=" + encodeURIComponent("Espace Officiers – document à télécharger") + "&body=" + encodeURIComponent(body);
    return;
  }
  const fb = e.target.closest("[data-file]");
  if (fb) { getFile(fb.dataset.file, fb.dataset.name, fb); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { goTab(tb.dataset.tab); return; }
  const dg = e.target.closest("[data-day-go]");
  if (dg) {
    const cell = app.querySelector(`#cal [data-day="${dg.dataset.dayGo}"]`);
    if (!cell) { let n = 0; const nx = () => app.querySelector("#cal [data-cal='1']"); while (!app.querySelector(`#cal [data-day="${dg.dataset.dayGo}"]`) && n++ < 24) nx().click(); }
    const c2 = app.querySelector(`#cal [data-day="${dg.dataset.dayGo}"]`);
    if (c2) { c2.click(); app.querySelector("#cal .cal-list").scrollIntoView({behavior: "smooth", block: "start"}); }
    return;
  }
  const b = e.target.closest("[data-goto]");
  if (!b) return;
  const d = app.querySelector("#" + b.dataset.goto);
  if (!d) return;
  const pg = d.closest(".page");
  if (pg && pg.hidden) goTab(pg.dataset.page);
  d.open = true;
  setTimeout(() => d.scrollIntoView({behavior: "smooth", block: "start"}), 30);
});

/* ---------- Calendar ---------- */
const CAT = {fete:"Fête d'armes", commu:"Communauté", admin:"Démarches", noel:"Noël", musique:"Concerts", sortie:"Sorties", carnaval:"Carnaval"};
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function fmt(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("fr-FR", {day: "numeric", month: "short"}); }

function buildCalendar() {
  const box = app.querySelector("#cal");
  if (!box) return;
  let ev = [];
  try { ev = JSON.parse(app.querySelector("#events-data").textContent); } catch (_) {}
  const fetes = [...app.querySelectorAll("li[data-md]")].map(li => ({t: li.querySelector("strong").textContent, md: li.dataset.md, n: li.querySelector(".txt span").textContent, c: "fete"}));
  const now = new Date(), today = iso(now);
  let y = now.getFullYear(), m = now.getMonth(), sel = today;

  const onDay = ds => ev.filter(e => e.s <= ds && (e.e || e.s) >= ds)
      .concat(fetes.filter(f => f.md === ds.slice(5)).map(f => ({...f, s: ds})));
  const isLong = e => e.e && (Date.parse(e.e) - Date.parse(e.s)) / 864e5 > 3;
  const item = (e, when) => `<li><span class="when">${when}</span><span class="what"><strong><i class="dot c-${e.c}"></i>${esc(e.t)}</strong>` +
      `${e.h ? `<span>${esc(e.h)}</span>` : ""}${e.l ? `<span>${esc(e.l)}</span>` : ""}${e.n ? `<span>${esc(e.n)}</span>` : ""}` +
      `${e.u ? `<span><a href="${esc(e.u)}" target="_blank" rel="noopener">Site et billets ↗</a></span>` : ""}</span></li>`;
  const range = e => e.e ? `${fmt(e.s)} → ${fmt(e.e)}` : fmt(e.s);

  function render() {
    const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const mStart = `${y}-${pad(m + 1)}-01`, mEnd = `${y}-${pad(m + 1)}-${pad(days)}`;
    let h = `<div class="cal-head"><button type="button" data-cal="-1" aria-label="Mois précédent">‹</button>` +
      `<h4>${first.toLocaleDateString("fr-FR", {month: "long", year: "numeric"})}</h4>` +
      `<button type="button" data-cal="0">Aujourd'hui</button><button type="button" data-cal="1" aria-label="Mois suivant">›</button></div>`;
    h += `<div class="cal-legend">${Object.entries(CAT).map(([k, v]) => `<span><i class="c-${k}"></i>${v}</span>`).join("")}</div>`;
    h += `<div class="cal-grid">${["lun", "mar", "mer", "jeu", "ven", "sam", "dim"].map(d => `<div class="dow">${d}</div>`).join("")}`;
    for (let i = 0; i < lead; i++) h += `<button type="button" class="day out" tabindex="-1" aria-hidden="true"></button>`;
    for (let d = 1; d <= days; d++) {
      const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
      const all = onDay(ds);
      const list = all.filter(e => !isLong(e)).map(e => ({c: e.c, t: e.t}))
        .concat(all.filter(e => isLong(e) && e.s === ds).map(e => ({c: e.c, t: "Début : " + e.t})))
        .concat(all.filter(e => isLong(e) && e.e === ds).map(e => ({c: e.c, t: "Fin : " + e.t})));
      const max = window.matchMedia("(max-width: 640px)").matches ? 2 : 3;
      const cls = ["day", ds === today ? "today" : "", ds === sel ? "sel" : "", list.length ? "has" : ""].join(" ");
      h += `<button type="button" class="${cls}" data-day="${ds}" aria-label="${d} : ${list.length} événement(s)"><span class="num">${d}</span>` +
        list.slice(0, max).map(e => `<span class="chip c-${e.c}" title="${esc(e.t)}">${esc(e.t)}</span>`).join("") +
        (list.length > max ? `<span class="more">+${list.length - max}</span>` : "") + `</button>`;
    }
    h += `</div><div class="cal-list">`;
    if (sel && sel >= mStart && sel <= mEnd) {
      const l = onDay(sel);
      h += `<h5>${new Date(sel + "T12:00").toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"})}</h5>`;
      h += l.length ? `<ul>${l.map(e => item(e, e.c === "fete" ? "Fête d'armes" : range(e))).join("")}</ul>` : `<p class="empty">Rien de prévu ce jour-là.</p>`;
    }
    const short = [], past = [];
    for (let d = 1; d <= days; d++) {
      const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
      onDay(ds).filter(e => !isLong(e) && (e.s === ds || ds === mStart)).forEach(e => {
        const html = item(e, e.c === "fete" ? fmt(ds) : range(e));
        ((e.c === "fete" ? ds : (e.e || e.s)) < today ? past : short).push(html);
      });
    }
    const long = ev.filter(e => isLong(e) && e.s <= mEnd && e.e >= mStart && e.e >= today).map(e => item(e, range(e)));
    h += `<h5>${mEnd < today ? "Ce mois-là" : "À venir ce mois-ci"}</h5>` + (short.length ? `<ul>${short.join("")}</ul>` : `<p class="empty">${past.length ? "Plus rien de prévu ce mois-ci." : "Aucun événement daté ce mois-ci."}</p>`);
    if (long.length) h += `<h5>En cours sur la période</h5><ul>${long.join("")}</ul>`;
    if (past.length) h += `<details class="past-ev"><summary>Déjà passés (${past.length})</summary><ul>${past.join("")}</ul></details>`;
    box.innerHTML = h + `</div>`;
  }
  box.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cal !== undefined) {
      const k = +b.dataset.cal;
      if (k === 0) { y = now.getFullYear(); m = now.getMonth(); sel = today; }
      else { m += k; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } sel = null; }
      render();
    } else if (b.dataset.day) { sel = b.dataset.day; render(); }
  });
  let rw; window.addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => box.isConnected && render(), 200); });
  render();
}

/* ---------- Map (Leaflet + OpenStreetMap, loaded on first visit to the tab) ---------- */
const MAPCAT = {noel: ["Noël", "#B3261E"], nature: ["Nature", "#1F7A4A"], loisirs: ["Loisirs", "#7A4FB0"], villes: ["Villes", "#1A335C"], shopping: ["Shopping & restos", "#D98A00"]};
let mapDone = false;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, ko) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="; css.crossOrigin = "";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="; s.crossOrigin = "";
    s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  });
}
function initMap() {
  const el = app.querySelector("#map");
  if (!el || mapDone) return;
  mapDone = true;
  loadLeaflet().then(() => {
    el.innerHTML = "";
    const map = L.map(el, {scrollWheelZoom: false}).setView([50.93, 5.97], 10);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap"}).addTo(map);
    L.circleMarker([50.9467, 5.9709], {radius: 9, color: "#fff", weight: 2, fillColor: "#15202B", fillOpacity: 1}).addTo(map).bindPopup("<strong>Brunssum</strong>");
    const groups = {}, all = [];
    app.querySelectorAll("ul.spots li[data-lat]").forEach(li => {
      const c = li.dataset.cat, col = (MAPCAT[c] || ["", "#555"])[1];
      groups[c] = groups[c] || L.layerGroup().addTo(map);
      const meta = li.querySelector(".meta");
      const mk = L.circleMarker([+li.dataset.lat, +li.dataset.lon], {radius: 8, color: "#fff", weight: 2, fillColor: col, fillOpacity: .95})
        .bindPopup(`<strong>${esc(li.querySelector("strong").textContent)}</strong>${meta ? "<br>" + esc(meta.textContent) : ""}`);
      mk.addTo(groups[c]); all.push([+li.dataset.lat, +li.dataset.lon]);
      li.addEventListener("click", ev => {
        if (ev.target.closest("a")) return;
        if (!map.hasLayer(groups[c])) map.addLayer(groups[c]);
        el.scrollIntoView({behavior: "smooth", block: "center"});
        map.setView([+li.dataset.lat, +li.dataset.lon], 13); mk.openPopup();
      });
    });
    if (all.length) map.fitBounds(all, {padding: [20, 20]});
    const f = app.querySelector("#map-filters");
    f.innerHTML = Object.keys(groups).map(c => `<button type="button" aria-pressed="true" data-mcat="${c}"><i class="dot" style="background:${MAPCAT[c][1]}"></i>${MAPCAT[c][0]}</button>`).join("");
    f.addEventListener("click", e => {
      const b = e.target.closest("button[data-mcat]"); if (!b) return;
      const g = groups[b.dataset.mcat], on = map.hasLayer(g);
      on ? map.removeLayer(g) : map.addLayer(g);
      b.setAttribute("aria-pressed", String(!on));
    });
    setTimeout(() => map.invalidateSize(), 50);
  }).catch(() => {
    el.innerHTML = '<p class="map-msg">La carte n\'a pas pu être chargée (connexion ou réseau filtré). La liste ci-dessous reste disponible.</p>';
  });
}

/* ---------- Concours (EdG oral feedback, decrypted on first visit) ---------- */
let CC = null, ccDone = false;
async function initConcours() {
  if (ccDone) return; ccDone = true;
  const root = app.querySelector('div.page[data-page="concours"]');
  if (!root) return;
  try { CC = JSON.parse(new TextDecoder().decode(await decryptFile("concours.json"))); }
  catch (_) { root.querySelector("#cc-count").textContent = "Impossible de charger les témoignages."; return; }
  const st = {q: "", y: new Set(), ep: new Set(), n: 20};
  const years = [...new Set(CC.map(r => r.y))].sort();
  const mk = (box, vals, key, label) => { box.innerHTML = vals.map(v => `<button type="button" data-f="${key}" data-v="${v}" aria-pressed="false">${label(v)}</button>`).join(""); };
  mk(root.querySelector("#cc-years"), years, "y", v => v);
  mk(root.querySelector("#cc-eps"), ["SHRI", "SI"], "ep", v => v);
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  CC.forEach(r => r._t = norm([r.s, r.r, r.q, r.en, r.lec, r.jury].join(" ")));
  const block = (t, v) => v && v.replace(/[-–\s]/g, "").length > 2 ? `<h6>${t}</h6><p class="pre">${esc(v)}</p>` : "";
  const hl = s => { const q = st.q.trim(); if (q.length < 3) return esc(s); const i = norm(s).indexOf(norm(q)); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); };
  function render() {
    const q = norm(st.q.trim());
    const res = CC.filter(r => (!st.y.size || st.y.has(String(r.y))) && (!st.ep.size || st.ep.has(r.ep)) && (!q || r._t.includes(q)));
    root.querySelector("#cc-count").textContent = `${res.length} témoignage${res.length > 1 ? "s" : ""}`;
    root.querySelector("#cc-list").innerHTML = res.slice(0, st.n).map(r => `<details class="fiche cc">
      <summary><strong>${hl(r.s)}</strong><span>${r.y} · ${r.ep}</span></summary>
      <div class="body">${block("Questions posées", r.q)}${block("Anglais", r.en)}${block("Lectures obligatoires", r.lec)}${block("Jury", r.jury)}</div></details>`).join("");
    root.querySelector("#cc-more").hidden = res.length <= st.n;
  }
  root.addEventListener("click", e => {
    const f = e.target.closest("[data-f]");
    if (f) { const set = st[f.dataset.f], v = f.dataset.v; set.has(v) ? set.delete(v) : set.add(v); f.setAttribute("aria-pressed", String(set.has(v))); st.n = 20; render(); return; }
    if (e.target.closest("#cc-more")) { st.n += 20; render(); return; }
    const d = e.target.closest("[data-draw]");
    if (d) {
      const pool = CC.filter(r => r.ep === d.dataset.draw).flatMap(r => [r.s, r.r]).filter(s => s && s.length > 15 && !/^un sujet|^sujet sur|^question sur/i.test(s));
      const uniq = [...new Set(pool)], a = uniq[Math.floor(Math.random() * uniq.length)];
      let c = a; while (c === a && uniq.length > 1) c = uniq[Math.floor(Math.random() * uniq.length)];
      const out = root.querySelector("#draw-out");
      out.innerHTML = `<p class="src">Épreuve ${d.dataset.draw} · choisissez un sujet :</p><ol><li>${esc(a)}</li><li>${esc(c)}</li></ol>`;
      out.hidden = false;
    }
  });
  let tq; root.querySelector("#cc-q").addEventListener("input", e => { clearTimeout(tq); tq = setTimeout(() => { st.q = e.target.value; st.n = 20; render(); }, 150); });
  render();
}

/* ---------- Quiz ---------- */
let qzDone = false, qzTimer = null;
function initQuiz() {
  if (qzDone) return; qzDone = true;
  const root = app.querySelector('div.page[data-page="quiz"]');
  if (!root) return;
  let BANK = [];
  try { BANK = JSON.parse(root.querySelector("#quiz-data").textContent); } catch (_) { return; }
  const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }};
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return [t.getUTCFullYear(), Math.ceil(((t - y0) / 864e5 + 1) / 7)]; }
  const [wy, wn] = isoWeek(new Date()), WEEK = `${wy}-S${wn}`;
  let CFG = {}; try { CFG = JSON.parse(root.querySelector("#quiz-config").textContent); } catch (_) {}
  const ON = !!(CFG.url && CFG.key);
  const H = () => Object.assign({apikey: CFG.key, "Content-Type": "application/json"}, CFG.key.startsWith("eyJ") ? {Authorization: "Bearer " + CFG.key} : {});
  async function globalBoard() {
    const box = root.querySelector("#quiz-global");
    if (!ON) { box.closest("section").hidden = true; return; }
    try {
      const r = await fetch(`${CFG.url}/rest/v1/quiz_scores?select=ini,pts,ok&week=eq.${encodeURIComponent(WEEK)}&order=pts.desc,created_at.asc&limit=20`, {headers: H()});
      if (!r.ok) throw 0;
      const rows = await r.json();
      box.innerHTML = rows.length ? `<h6>Défi semaine ${wn} · ${rows.length} participant${rows.length > 1 ? "s" : ""}</h6><ol class="lb">${rows.map((s, i) => `<li><span class="rk">${["🥇", "🥈", "🥉"][i] || (i + 1) + "."}</span><b>${esc(s.ini)}</b><span>${s.ok}/10</span><span class="pts">${s.pts} pts</span></li>`).join("")}</ol>`
        : `<p class="empty">Personne n'a encore relevé le défi de la semaine ${wn}. Soyez le premier !</p>`;
    } catch (_) { box.innerHTML = `<p class="empty">Classement commun momentanément indisponible.</p>`; }
  }
  async function postScore(s) {
    if (!ON) return "";
    try {
      const r = await fetch(`${CFG.url}/rest/v1/quiz_scores`, {method: "POST", headers: Object.assign(H(), {Prefer: "return=minimal"}), body: JSON.stringify({week: WEEK, ini: s.ini, pts: s.pts, ok: s.ok})});
      if (r.status === 409) return "Ces initiales ont déjà joué le défi cette semaine : le premier score est conservé.";
      if (!r.ok) throw 0;
      return "Score enregistré au classement de la communauté !";
    } catch (_) { return "Le score n'a pas pu être envoyé au classement commun."; }
  }
  root.querySelector("#quiz-week-info").textContent = `Défi en cours : semaine ${wn} de ${wy}.`;
  const ini = root.querySelector("#quiz-ini");
  ini.value = LS.get("qz-ini", "");
  ini.addEventListener("input", () => { ini.value = ini.value.toUpperCase().replace(/[^A-ZÀ-Ÿ.\-]/g, "").slice(0, 4); LS.set("qz-ini", ini.value); });
  const GOOD = ["Dans le mille !", "Validé par l'état-major !", "Bien vu, mon commandant !", "Mission accomplie !", "Impeccable !", "Le JFC est fier de vous !"];
  const BAD = ["Raté… mais l'honneur est sauf.", "Au rapport !", "Même le SACEUR hésite parfois.", "On révise et on y retourne !", "Repli tactique…"];
  const SLOW = ["Trop tard, la fenêtre de tir s'est refermée !", "Le chrono ne pardonne pas…"];
  const TITLES = [[10, "Généralissime 🎖️"], [8, "Colonel de la culture G 🦅"], [6, "Lieutenant éclairé ⭐"], [4, "Caporal-chef du quiz 💪"], [0, "Jeune recrue 🐣"]];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let G = null;
  function board() {
    const b = LS.get("qz-board", []).filter(s => s.mode === "week" && s.week === WEEK).sort((x, y) => y.pts - x.pts).slice(0, 10);
    const f = LS.get("qz-board", []).filter(s => s.mode === "free").sort((x, y) => y.pts - x.pts).slice(0, 5);
    const row = (s, i) => `<li><span class="rk">${["🥇", "🥈", "🥉"][i] || (i + 1) + "."}</span><b>${esc(s.ini || "???")}</b><span>${s.ok}/10</span><span class="pts">${s.pts} pts</span></li>`;
    root.querySelector("#quiz-board").innerHTML = (b.length ? `<h6>Défi semaine ${wn}</h6><ol class="lb">${b.map(row).join("")}</ol>` : `<p class="empty">Personne n'a encore relevé le défi de la semaine ${wn} sur cet appareil.</p>`) + (f.length ? `<h6>Entraînement libre (meilleurs scores)</h6><ol class="lb">${f.map(row).join("")}</ol>` : "");
  }
  function start(mode) {
    if (!ini.value || ini.value.length < 2) { ini.focus(); ini.classList.add("shake"); setTimeout(() => ini.classList.remove("shake"), 500); return; }
    const r = mode === "week" ? rng(wy * 100 + wn) : Math.random;
    const qs = shuffle(BANK, r).slice(0, 10).map(q => ({...q, opts: shuffle(q.c, r)}));
    const replay = mode === "week" && LS.get("qz-board", []).some(s => s.mode === "week" && s.week === WEEK && s.ini === ini.value);
    G = {mode, qs, i: 0, pts: 0, ok: 0, streak: 0, replay};
    root.querySelector("#quiz-start").hidden = true;
    if (replay) root.querySelector("#quiz-week-info").textContent = `Déjà joué cette semaine : cette partie sera hors classement.`;
    ask();
  }
  function ask() {
    const q = G.qs[G.i], play = root.querySelector("#quiz-play");
    play.hidden = false;
    play.innerHTML = `<div class="qz-top"><span>Question ${G.i + 1}/10 · ${esc(q.t)}</span><span class="qz-pts">${G.pts} pts${G.streak >= 3 ? " 🔥" + G.streak : ""}</span></div>
      <div class="qz-bar"><i style="width:${G.i * 10}%"></i></div>
      <div class="qz-timer"><i id="qz-t"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="qz-opts">${q.opts.map((o, k) => `<button type="button" class="qz-o" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <div class="qz-fb" id="qz-fb"></div>`;
    const t0 = performance.now(), bar = play.querySelector("#qz-t");
    clearInterval(qzTimer);
    qzTimer = setInterval(() => {
      const left = Math.max(0, 15 - (performance.now() - t0) / 1000);
      bar.style.width = (left / 15 * 100) + "%"; bar.classList.toggle("low", left < 5);
      if (left <= 0) answer(-1, 0);
    }, 100);
    play.querySelectorAll(".qz-o").forEach(btn => btn.addEventListener("click", () => answer(+btn.dataset.k, Math.max(0, 15 - (performance.now() - t0) / 1000))));
  }
  function answer(k, left) {
    clearInterval(qzTimer);
    const q = G.qs[G.i], play = root.querySelector("#quiz-play"), good = q.opts.indexOf(q.c[0]);
    if (play.querySelector(".qz-o[disabled]")) return;
    play.querySelectorAll(".qz-o").forEach((b, j) => { b.disabled = true; if (j === good) b.classList.add("ok"); else if (j === k) b.classList.add("ko"); });
    let msg;
    if (k === good) { const p = 100 + Math.round(left * 10); G.pts += p; G.ok++; G.streak++; msg = `<b class="g">${pick(GOOD)}</b> +${p} pts`; }
    else { G.streak = 0; msg = `<b class="b">${k < 0 ? pick(SLOW) : pick(BAD)}</b> Réponse : ${esc(q.c[0])}`; }
    play.querySelector("#qz-fb").innerHTML = `<p>${msg}</p><p class="src">${esc(q.x)}</p><button type="button" class="dl" id="qz-next">${G.i < 9 ? "Question suivante →" : "Voir mon résultat"}</button>`;
    play.querySelector("#qz-next").addEventListener("click", () => { G.i++; G.i < 10 ? ask() : end(); });
    play.querySelector("#qz-next").focus();
  }
  function end() {
    const title = TITLES.find(([n]) => G.ok >= n)[1];
    if (!G.replay) { const all = LS.get("qz-board", []); all.push({ini: ini.value, pts: G.pts, ok: G.ok, mode: G.mode, week: WEEK, d: Date.now()}); LS.set("qz-board", all.slice(-200)); }
    const posting = (!G.replay && G.mode === "week") ? postScore({ini: ini.value, pts: G.pts, ok: G.ok}) : Promise.resolve("");
    const txt = `🎖️ Quiz Espace Officiers – ${G.mode === "week" ? "Défi semaine " + wn + (G.replay ? " (rejoué)" : "") : "Entraînement"}\n${ini.value} : ${G.pts} pts (${G.ok}/10) – ${title}\nQui fait mieux ?`;
    const play = root.querySelector("#quiz-play");
    play.innerHTML = `<div class="qz-end"><p class="qz-title">${title}</p><p class="qz-big">${G.pts} pts</p><p>${G.ok} bonne${G.ok > 1 ? "s" : ""} réponse${G.ok > 1 ? "s" : ""} sur 10</p>${G.replay ? `<p class="src">Défi déjà joué par ${esc(ini.value)} cette semaine : seule la première partie compte (hors classement).</p>` : ""}
      <div class="draw-bar" style="justify-content:center"><button type="button" class="dl" id="qz-share">Partager mon score</button><button type="button" class="dl alt" id="qz-again">Rejouer</button></div><p class="src" id="qz-shared"></p></div>`;
    play.querySelector("#qz-share").addEventListener("click", async () => {
      try { if (navigator.share) { await navigator.share({text: txt}); return; } } catch (_) { return; }
      try { await navigator.clipboard.writeText(txt); play.querySelector("#qz-shared").textContent = "Copié ! Collez-le dans le groupe de la communauté."; }
      catch (_) { play.querySelector("#qz-shared").textContent = txt; }
    });
    play.querySelector("#qz-again").addEventListener("click", () => { play.hidden = true; root.querySelector("#quiz-start").hidden = false; });
    board();
    posting.then(m => { if (m) { play.querySelector("#qz-shared").textContent = m; globalBoard(); } });
  }
  root.addEventListener("click", e => { const b = e.target.closest("[data-quiz]"); if (b) start(b.dataset.quiz); });
  board();
  globalBoard();
}

lock.addEventListener("click", () => {
  mapDone = false; KEY = null; ccDone = false; CC = null; qzDone = false; clearInterval(qzTimer);
  app.innerHTML = ""; app.hidden = true; lock.hidden = true; tabs.hidden = true; tabs.innerHTML = "";
  gate.hidden = false; input.value = ""; input.focus();
});
</script>
</body>
