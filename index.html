<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace Officiers · Brunssum</title>
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#F3F5F7,#0E141B);
  --paper:light-dark(#FFFFFF,#151D26);
  --ink:light-dark(#15202B,#E3E8EE);
  --muted:light-dark(#5B6877,#93A0AE);
  --line:light-dark(#D8DEE4,#283340);
  --navy:light-dark(#1A335C,#8FB3E6);
  --navy-soft:light-dark(#E6EDF7,#1B2838);
  --err:light-dark(#A12A2A,#F08C8C);
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f)}
header{background:var(--navy);color:light-dark(#fff,#0E141B);padding:18px 20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:1.25rem;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
.wrap{max-width:760px;margin:0 auto}
main{padding:24px 16px 48px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px}
#gate{max-width:380px;margin:40px auto;text-align:center}
#gate h2{margin:0 0 6px;font-size:1.15rem}
#gate p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
#code{width:100%;font:600 1.8rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;text-align:center;padding:14px 0 14px .15em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#code:focus{outline:2px solid var(--navy);outline-offset:1px}
button{font:600 1rem var(--f);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--navy);color:light-dark(#fff,#0E141B)}
button:disabled{opacity:.6;cursor:wait}
#submit{width:100%;margin-top:12px}
#error{min-height:1.4em;margin-top:10px;color:var(--err);font-size:.9rem}
#lock{background:transparent;border:1px solid currentColor;color:inherit;padding:6px 12px;font-size:.85rem}
#app section{margin-bottom:28px}
#app h2{font-size:1.1rem;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px}
#app .note{background:var(--navy-soft);border-radius:6px;padding:10px 12px;font-size:.92rem}
#app .date{display:inline-block;min-width:88px;font-weight:600;color:var(--navy)}
#app ul{padding-left:20px}
#app ul.agenda{list-style:none;padding:0}
#app ul.agenda li{padding:6px 0;border-bottom:1px dashed var(--line)}
#app h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
#app ul.fetes{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
#app ul.fetes li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
#app .tile{flex:none;width:52px;text-align:center;background:var(--navy);color:light-dark(#fff,#0E141B);border-radius:6px;padding:6px 0;line-height:1.1}
#app .tile b{display:block;font-size:1.3rem}
#app .tile small{font-size:.65rem;font-weight:600;letter-spacing:.05em}
#app .txt strong{display:block;font-size:.95rem}
#app .txt span{display:block;font-size:.85rem;color:var(--muted);line-height:1.4}
#app li.next{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;background:var(--navy-soft)}
#app li.next .txt strong::after{content:"Prochaine";margin-left:8px;font-size:.7rem;font-weight:600;color:var(--navy);border:1px solid var(--navy);border-radius:10px;padding:1px 7px;vertical-align:2px}
#app li.past{opacity:.55}
#app .next-line{background:var(--navy-soft);border-radius:6px;padding:10px 12px;font-size:.95rem}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
#tabs button{background:var(--paper);color:var(--navy);border:1px solid var(--line);padding:9px 16px;font-size:.95rem}
#tabs button[aria-selected="true"]{background:var(--navy);color:light-dark(#fff,#0E141B);border-color:var(--navy)}
#app ul.spots{list-style:none;padding:0;margin:0;display:grid;gap:8px}
#app ul.spots li{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#app ul.spots strong{display:block;font-size:.98rem}
#app ul.spots .meta{display:block;font-size:.8rem;font-weight:600;color:var(--navy);margin:2px 0 4px}
#app ul.spots li > span:last-child{display:block;font-size:.9rem;color:var(--muted);line-height:1.45}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>Espace Officiers</h1><p>Communauté des officiers · Brunssum</p></div>
  <button id="lock" hidden type="button">Verrouiller</button>
</div></header>
<main class="wrap">
  <form id="gate" class="card" autocomplete="off">
    <h2>Accès réservé</h2>
    <p>Saisissez le code d'accès.</p>
    <input id="code" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="12" placeholder="XXXX-XXXX" aria-label="Code d'accès" autofocus>
    <button id="submit" type="submit">Entrer</button>
    <div id="error" role="alert"></div>
  </form>
  <nav id="tabs" role="tablist" hidden></nav>
  <div id="app" class="card" hidden></div>
</main>
<footer>Informations non classifiées uniquement.</footer>

const $ = id => document.getElementById(id);
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const gate = $("gate"), input = $("code"), err = $("error"), app = $("app"), tabs = $("tabs"), lock = $("lock"), btn = $("submit");

input.addEventListener("input", () => { input.value = input.value.toUpperCase(); err.textContent = ""; });

async function open(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.i)}, key, b(P.c));
  return new TextDecoder().decode(pt);
}

gate.addEventListener("submit", async e => {
  e.preventDefault();
  const code = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 8) { err.textContent = "Le code comporte 8 caractères."; return; }
  btn.disabled = true; btn.textContent = "Vérification…"; err.textContent = "";
  try {
    app.innerHTML = await open(code);
    gate.hidden = true; app.hidden = false; lock.hidden = false;
    markNext();
    buildTabs();
  } catch (_) {
    err.textContent = "Code incorrect.";
    input.select();
  } finally {
    btn.disabled = false; btn.textContent = "Entrer";
  }
});

function markNext() {
  const items = [...app.querySelectorAll("li[data-md]")];
  if (!items.length) return;
  const now = new Date();
  const today = String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  let firstMd = items.find(li => li.dataset.md >= today)?.dataset.md || items[0].dataset.md;
  items.forEach(li => {
    if (li.dataset.md === firstMd) li.classList.add("next");
    else if (li.dataset.md < today) li.classList.add("past");
  });
  const nexts = items.filter(li => li.dataset.md === firstMd);
  const line = app.querySelector("#next-fete");
  if (line) {
    const [m, d] = firstMd.split("-").map(Number);
    const date = new Date(now.getFullYear() + (firstMd < today ? 1 : 0), m - 1, d);
    const label = date.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
    const names = nexts.map(li => li.querySelector("strong").textContent).join(", ");
    line.textContent = (firstMd === today ? "Aujourd'hui : " : "Prochaine fête d'armes : ") + names + " (" + label + ")";
    line.hidden = false;
  }
}

function buildTabs() {
  const pages = [...app.querySelectorAll(".page")];
  tabs.innerHTML = "";
  if (pages.length < 2) return;
  const show = id => {
    pages.forEach(p => p.hidden = p.dataset.page !== id);
    [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.page === id));
    try { history.replaceState(null, "", "#" + id); } catch (_) {}
    window.scrollTo(0, 0);
  };
  pages.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab");
    b.dataset.page = p.dataset.page; b.textContent = p.dataset.title;
    b.addEventListener("click", () => show(p.dataset.page));
    tabs.appendChild(b);
  });
  const start = location.hash.slice(1);
  show(pages.some(p => p.dataset.page === start) ? start : pages[0].dataset.page);
  tabs.hidden = false;
}

lock.addEventListener("click", () => {
  app.innerHTML = ""; app.hidden = true; lock.hidden = true; tabs.hidden = true; tabs.innerHTML = "";
  gate.hidden = false; input.value = ""; input.focus();
});
</script>
